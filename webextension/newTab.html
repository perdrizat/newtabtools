License, v. 2.0. If a copy of the MPL was not distributed with this

<html options-hidden="true" drawer-tab="page">
<head>
	<meta charset="utf-8"/>
	<title data-message="newtab_pageTitle"></title>
	<link rel="stylesheet" href="tokens.css" type="text/css" />
	<link rel="stylesheet" href="newTab.css" type="text/css" />
	<link id="dark-icons" rel="stylesheet" href="darkIcons.css" type="text/css" />
</head>
<body>
	<div id="background-fake"></div>
	<div id="newtab-scrollbox" tabindex="0">
		<div id="newtab-vertical-margin">
			<div id="ntt-titlebar">
				<div id="ntt-titlebar-recent" hidden=""></div>
				<div id="ntt-search">
					<input id="ntt-search-input" type="text" data-placeholder="search_placeholder" autocomplete="off" />
					<span class="ntt-search-kbd">/</span>
				</div>
				<button id="options-toggle" type="button" data-message="options_edit"></button>
			</div>
			<div id="newtab-margin-top">
				<div class="newtab-side-margin newtab-margin-left"></div>
				<div class="newtab-side-margin newtab-margin-right"></div>
			</div>
			<div id="newtab-horizontal-margin">
				<div class="newtab-side-margin newtab-margin-left"></div>
				<div id="newtab-grid"></div>
				<div class="newtab-side-margin newtab-margin-right"></div>
			</div>
			<div id="newtab-margin-bottom">
				<div class="newtab-side-margin newtab-margin-left"></div>
				<div class="newtab-side-margin newtab-margin-right"></div>
			</div>
			<!-- Removed-tile undo toast — a floating notice (the bottom status
			     bar was retired in Phase 4-0/5-1) so tile-removal undo works. -->
			<div id="newtab-undo-container" undo-disabled="true">
				<label id="newtab-undo-label" data-message="newtab_undo_removedLabel"></label>
				<button id="newtab-undo-button" tabindex="-1" data-message="newtab_undo_undoButton"></button>
				<button id="newtab-undo-restore-button" tabindex="-1" data-message="newtab_undo_restoreButton"></button>
				<button id="newtab-undo-close-button" class="close-button" tabindex="-1" data-title="newtab_undo_closeTooltip"></button>
			</div>
		</div>
	</div>
	<aside id="ntt-drawer" aria-hidden="true" tabindex="-1">
		<header id="ntt-drawer-header">
			<span id="ntt-drawer-title" data-message="drawer_title"></span>
			<button id="ntt-drawer-close" class="close-button" type="button" aria-label="Close"></button>
		</header>
		<nav id="ntt-drawer-tabs" role="tablist">
			<button type="button" role="tab" data-drawer-tab="tile" data-active="false" data-message="drawer_tab_tile"></button>
			<button type="button" role="tab" data-drawer-tab="page" data-active="true" data-message="drawer_tab_page"></button>
			<button type="button" role="tab" data-drawer-tab="advanced" data-active="false" data-message="drawer_tab_advanced"></button>
		</nav>
		<div id="ntt-drawer-body">
			<section data-drawer-panel="tile" hidden="">
				<div class="ntt-form-group">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="pin_url_header"></span>
					</div>
					<div class="options-row">
						<input id="options-pinURL-input" type="url" required="true" autocomplete="off" data-placeholder="pin_url_placeholder" />
						<button id="options-pinURL" class="ntt-btn-primary" data-message="pin_url_button"></button>
					</div>
					<div class="options-row" style="position: relative;">
						<ul id="autocomplete" hidden="">
							<li id="options-pinURL-blocked">
								<p data-message="pin_url_permissions"></p>
								<div>
									<button id="options-pinURL-permissions" data-message="pin_url_request"></button>
								</div>
							</li>
						</ul>
						<template>
							<li>
								<div class="autocomplete-icon"></div>
								<div class="autocomplete-detail">
									<div class="autocomplete-title" tabindex="-1"></div>
									<div class="autocomplete-url" tabindex="-1"></div>
								</div>
							</li>
						</template>
					</div>
				</div>
				<hr class="ntt-drawer-divider" />
				<div class="ntt-empty-state" data-tile-empty="" data-message="tile_empty_state"></div>
				<div id="options-tile">
					<div class="ntt-form-group">
						<div class="ntt-form-group-head">
							<span class="ntt-form-group-label" data-message="tile_header"></span>
						</div>
						<div id="options-thumbnail-wrap" class="options-row">
							<div id="options-thumbnail" class="newtab-thumbnail"></div>
						</div>
						<div id="options-edit-url" class="options-row">
							<input id="options-url-input" data-placeholder="tile_url_placeholder" />
							<button id="options-url-set" class="ntt-btn-primary" data-message="tile_url_set"></button>
							<button id="options-url-remove" class="ntt-btn-danger" data-message="tile_thumbnail_remove"></button>
						</div>
						<div class="options-row">
							<button id="options-savethumb" data-message="tile_savedthumb_savecurrent"></button>
							<button id="options-savedthumb-remove" disabled="" data-message="tile_thumbnail_remove"></button>
						</div>
						<div class="options-row">
							<label for="options-savedthumb-input" class="ntt-btn-ghost ntt-file-label" data-message="tile_savedthumb_choose"></label><span class="ntt-file-name" data-message="backup_no_file"></span><input id="options-savedthumb-input" type="file" accept="image/*" class="ntt-visually-hidden" />
							<button id="options-savedthumb-set" disabled="" data-message="tile_savedthumb_set"></button>
							<button id="options-savedimg-clear" disabled="" data-message="tile_thumbnail_remove"></button>
						</div>
						<div class="options-row">
							<label style="flex: 1" for="options-bgcolor-input" data-message="tile_thumbnail_bgcolor"></label>
							<input id="options-bgcolor-input" type="color" />
							<button id="options-bgcolor-displaybutton">
								<div id="options-bgcolor-display">&#160;</div>
							</button>
							<button id="options-bgcolor-set" data-message="tile_savedthumb_set"></button>
							<button id="options-bgcolor-reset" data-message="tile_thumbnail_remove"></button>
						</div>
						<div id="options-edit-title" class="options-row">
							<input id="options-title-input" data-placeholder="tile_title_placeholder" />
							<button id="options-title-set" class="ntt-btn-primary" data-message="tile_title_set"></button>
							<button id="options-title-remove" data-message="tile_thumbnail_remove"></button>
						</div>
					</div>
				</div>
				<hr class="ntt-drawer-divider" />
				<div class="ntt-form-group" data-group="aspect">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_tile_aspect"></span>
					</div>
					<div class="ntt-segmented" role="radiogroup" data-pref="tileAspect">
						<button type="button" role="radio" data-value="fill" data-message="options_tile_aspect_fill"></button>
						<button type="button" role="radio" data-value="16-9">16:9</button>
						<button type="button" role="radio" data-value="4-3">4:3</button>
						<button type="button" role="radio" data-value="1-1">1:1</button>
						<button type="button" role="radio" data-value="3-4">3:4</button>
					</div>
				</div>
				<div class="ntt-form-group" data-group="tilechrome">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_tilechrome_header"></span>
					</div>
					<div class="ntt-toggle-row" data-pref="titleSize">
						<span class="ntt-toggle-label-stack">
							<span class="ntt-toggle-label" data-message="options_tilechrome_overlay"></span>
							<span class="ntt-toggle-sub" data-message="options_tilechrome_overlay_sub"></span>
						</span>
						<button type="button" role="switch" class="ntt-toggle" data-pref="titleSize" aria-checked="true"></button>
					</div>
					<div class="ntt-toggle-row" data-pref="tileActions">
						<span class="ntt-toggle-label-stack">
							<span class="ntt-toggle-label" data-message="options_tilechrome_actions"></span>
							<span class="ntt-toggle-sub" data-message="options_tilechrome_actions_sub"></span>
						</span>
						<button type="button" role="switch" class="ntt-toggle" data-pref="tileActions" aria-checked="true"></button>
					</div>
				</div>
				<div class="ntt-form-group" data-group="stat">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_stat_header"></span>
						<span class="ntt-form-group-help" data-message="options_stat_help"></span>
					</div>
					<div class="ntt-segmented" role="radiogroup" data-pref="statType">
						<button type="button" role="radio" data-value="none" data-message="options_stat_none"></button>
						<button type="button" role="radio" data-value="visits" data-message="options_stat_visits"></button>
						<button type="button" role="radio" data-value="last" data-message="options_stat_last"></button>
						<button type="button" role="radio" data-value="trend" data-message="options_stat_trend"></button>
						<button type="button" role="radio" data-value="rank" data-message="options_stat_rank"></button>
						<button type="button" role="radio" data-value="fresh" data-message="options_stat_fresh"></button>
					</div>
				</div>
				<div class="ntt-form-group" data-group="actionsize">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_actionsize_header"></span>
					</div>
					<div class="ntt-segmented" role="radiogroup" data-pref="actionIconSize">
						<button type="button" role="radio" data-value="small" data-message="options_size_small"></button>
						<button type="button" role="radio" data-value="medium" data-message="options_size_medium"></button>
						<button type="button" role="radio" data-value="large" data-message="options_size_large"></button>
					</div>
				</div>
			</section>
			<section data-drawer-panel="page">
				<div class="ntt-form-group" data-group="grid">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_grid_header"></span>
						<span class="ntt-form-group-help" data-message="options_grid_help"></span>
					</div>
					<div class="ntt-grid-row">
						<div class="ntt-segmented" role="radiogroup" data-pref="columns">
							<button type="button" role="radio" data-value="3">3</button>
							<button type="button" role="radio" data-value="4">4</button>
							<button type="button" role="radio" data-value="5">5</button>
							<button type="button" role="radio" data-value="6">6</button>
							<button type="button" role="radio" data-value="7">7</button>
						</div>
						<span class="ntt-grid-row-x">×</span>
						<div class="ntt-segmented" role="radiogroup" data-pref="rows">
							<button type="button" role="radio" data-value="2">2</button>
							<button type="button" role="radio" data-value="3">3</button>
							<button type="button" role="radio" data-value="4">4</button>
							<button type="button" role="radio" data-value="5">5</button>
						</div>
					</div>
				</div>
				<div class="ntt-form-group" data-group="spacing">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_spacing_header"></span>
						<span class="ntt-form-group-help" data-message="options_spacing_help"></span>
					</div>
					<div class="ntt-slider-snap" data-pref="spacing">
						<div class="ntt-slider-head">
							<span data-message="options_spacing_gap"></span>
							<span class="ntt-slider-value"></span>
						</div>
						<input type="range" min="0" max="2" step="1" data-pref="spacing" />
					</div>
					<div class="ntt-slider-snap" data-pref="margin">
						<div class="ntt-slider-head">
							<span data-message="options_spacing_padding"></span>
							<span class="ntt-slider-value"></span>
						</div>
						<input type="range" min="0" max="2" step="1" data-pref="margin" />
					</div>
					<div class="ntt-slider-snap" data-pref="tileRadius">
						<div class="ntt-slider-head">
							<span data-message="options_spacing_radius"></span>
							<span class="ntt-slider-value"></span>
						</div>
						<input type="range" min="0" max="2" step="1" data-pref="tileRadius" />
					</div>
				</div>
				<div class="ntt-form-group">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_theme"></span>
						<span class="ntt-form-group-help" data-message="options_theme_help"></span>
					</div>
					<div class="ntt-theme-cards" role="radiogroup" data-pref="theme">
						<button type="button" role="radio" class="ntt-theme-card" data-value="system" aria-checked="true">
							<span class="ntt-theme-card-swatch ntt-theme-swatch-inherit"></span>
							<span class="ntt-theme-card-label" data-message="options_theme_system"></span>
							<span class="ntt-theme-card-sub" data-message="options_theme_system_sub"></span>
						</button>
						<button type="button" role="radio" class="ntt-theme-card" data-value="light" aria-checked="false">
							<span class="ntt-theme-card-swatch ntt-theme-swatch-light"></span>
							<span class="ntt-theme-card-label" data-message="options_theme_light"></span>
							<span class="ntt-theme-card-sub" data-message="options_theme_light_sub"></span>
						</button>
						<button type="button" role="radio" class="ntt-theme-card" data-value="dark" aria-checked="false">
							<span class="ntt-theme-card-swatch ntt-theme-swatch-dark"></span>
							<span class="ntt-theme-card-label" data-message="options_theme_dark"></span>
							<span class="ntt-theme-card-sub" data-message="options_theme_dark_sub"></span>
						</button>
						<button type="button" role="radio" class="ntt-theme-card" data-value="contrast" aria-checked="false">
							<span class="ntt-theme-card-swatch ntt-theme-swatch-contrast"></span>
							<span class="ntt-theme-card-label" data-message="options_theme_contrast"></span>
							<span class="ntt-theme-card-sub" data-message="options_theme_contrast_sub"></span>
						</button>
					</div>
				</div>
				<div class="ntt-form-group" data-group="titlebar">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_titlebar_header"></span>
						<span class="ntt-form-group-help" data-message="options_titlebar_help"></span>
					</div>
					<div class="ntt-toggle-row" data-pref="recent">
						<span class="ntt-toggle-label"><span data-message="options_titlebar_recent"></span></span>
						<button type="button" role="switch" class="ntt-toggle" data-pref="recent" aria-checked="true"></button>
					</div>
					<div class="ntt-toggle-row" data-pref="titleBarSearch">
						<span class="ntt-toggle-label"><span data-message="options_titlebar_search"></span> <span class="ntt-toggle-kbd">/</span></span>
						<button type="button" role="switch" class="ntt-toggle" data-pref="titleBarSearch" aria-checked="true"></button>
					</div>
				</div>
				<div class="ntt-form-group" id="options-bg-group">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="bg_header"></span>
					</div>
					<div class="options-row">
						<button id="options-wallpaper-btn" data-message="bg_choose"></button>
						<button id="options-bg-remove" disabled="" data-message="bg_remove"></button>
					</div>
				</div>
				<div class="ntt-form-group">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_foreground_opacity"></span>
					</div>
					<input type="range" name="opacity" max="100" min="0" step="10" />
				</div>
			</section>
			<section data-drawer-panel="advanced" hidden="">
				<div class="ntt-form-group" data-group="history">
					<div class="ntt-toggle-row" data-pref="history">
						<span class="ntt-toggle-label"><span data-message="options_historytiles"></span></span>
						<button type="button" role="switch" class="ntt-toggle" data-pref="history" aria-checked="true"></button>
					</div>
					<div class="options-row">
						<button id="historytiles-filter" class="ntt-btn-ghost" aria-controls="options-filter" aria-expanded="false" data-message="filter_button"></button>
					</div>
				</div>
				<div class="ntt-form-group" id="options-filter" hidden="">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="filter_title"></span>
					</div>
						<table>
							<thead>
								<tr>
									<th align="left" data-message="filter_header_domain"></th>
									<th data-message="filter_header_pinned"></th>
									<th colspan="2" data-message="filter_header_unpinned"></th>
								</tr>
							</thead>
							<tfoot>
								<tr>
									<th align="left" colspan="4" data-message="filter_header_add"></th>
								</tr>
								<tr>
									<td colspan="2">
										<input id="options-filter-host" type="text" list="host-autocomplete" data-placeholder="filter_placeholder_host" required="" />
										<datalist id="host-autocomplete"></datalist>
									</td>
									<td>
										<div style="display: flex">
											<input id="options-filter-count" type="text" size="1" maxlength="2" required="" pattern="^\d+$" style="flex: 1; text-align: center;" data-placeholder="filter_placeholder_limit" />
											<button id="options-filter-set" class="ntt-btn-primary" disabled="" data-message="filter_set"></button>
										</div>
									</td>
								</tr>
								<tr>
									<td colspan="4" style="text-align: left; line-height: 1.5;" data-message="filter_helptext"></td>
								</tr>
							</tfoot>
							<tbody>
							</tbody>
							<template>
								<tr>
									<td></td>
									<td align="center"></td>
									<td align="center">
										<button class="minus-button" disabled=""></button>
										<span></span>
										<button class="plus-button"></button>
									</td>
								</tr>
							</template>
						</table>
				</div>
				<div class="ntt-form-group" id="options-nevercapture">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="nevercapture_title"></span>
					</div>
					<div class="ntt-form-group-help" data-message="nevercapture_helptext"></div>
					<div id="options-nevercapture-list"></div>
					<div class="options-row">
						<input id="options-nevercapture-host" type="text" data-placeholder="nevercapture_placeholder_host" />
						<button id="options-nevercapture-add" class="ntt-btn-primary" data-message="nevercapture_add"></button>
					</div>
				</div>
				<div class="ntt-form-group" id="options-export">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="backup_restore_header"></span>
					</div>
					<div class="ntt-form-group-help" data-message="backup_description"></div>
					<div class="options-row">
						<button id="options-backup" class="ntt-btn-ghost" data-message="backup_button"></button>
					</div>
					<div class="ntt-form-group-help" data-message="restore_description"></div>
					<div class="ntt-form-group-help" data-message="restore_warning"></div>
					<div class="options-row">
						<label for="options-restore-file" class="ntt-btn-ghost ntt-file-label" data-message="restore_choose_file"></label><span class="ntt-file-name" data-message="backup_no_file"></span><input id="options-restore-file" type="file" accept="application/zip" class="ntt-visually-hidden" />
						<button id="options-restore" class="ntt-btn-danger" disabled="" data-message="restore_button"></button>
					</div>
					<div class="options-row ntt-confirm-row" id="options-restore-confirm-row" hidden="">
						<span class="ntt-confirm-prompt" data-message="restore_confirm"></span>
						<button id="options-restore-confirm" class="ntt-btn-danger" data-message="confirm_yes"></button>
						<button id="options-restore-cancel" class="ntt-btn-ghost" data-message="confirm_cancel"></button>
					</div>
				</div>
				<div class="ntt-form-group" id="options-reset-group">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="reset_header"></span>
					</div>
					<div class="ntt-form-group-help" data-message="reset_description"></div>
					<div class="ntt-form-group-help" data-message="reset_warning"></div>
					<div class="options-row">
						<button id="options-reset-all" class="ntt-btn-danger" data-message="reset_button"></button>
					</div>
					<div class="options-row ntt-confirm-row" id="options-reset-confirm-row" hidden="">
						<span class="ntt-confirm-prompt" data-message="reset_confirm"></span>
						<button id="options-reset-confirm" class="ntt-btn-danger" data-message="confirm_yes"></button>
						<button id="options-reset-cancel" class="ntt-btn-ghost" data-message="confirm_cancel"></button>
					</div>
				</div>
				<div class="ntt-form-group" id="options-about">
					<div class="ntt-form-group-head">
						<span class="ntt-form-group-label" data-message="options_about_header"></span>
					</div>
					<div class="ntt-form-group-help">
						<a class="ntt-about-brand" href="https://addons.mozilla.org/firefox/addon/newtab-powertools/" target="_blank" rel="noopener"><img class="ntt-about-logo" src="images/icon.svg" alt="" /><strong data-message="extensionName"></strong> <span class="ntt-about-version">v<span data-version-slot=""></span></span></a>
					</div>
					<div class="ntt-form-group-help" data-message="options_about_tagline"></div>
					<div class="ntt-form-group-help" data-message="options_about_lineage"></div>
					<div class="options-row">
						<a href="https://github.com/perdrizat/newtabtools" data-message="github" target="_blank" rel="noopener"></a>
						<a href="https://github.com/perdrizat/newtabtools/blob/master/PRIVACY.md" data-message="options_about_privacy" target="_blank" rel="noopener"></a>
						<a href="https://github.com/perdrizat/newtabtools/blob/master/LICENSE" data-message="options_about_license" target="_blank" rel="noopener"></a>
					</div>
				</div>
			</section>
		</div>
		<footer id="ntt-drawer-footer">
			<span id="ntt-drawer-footer-msg" data-message="options_autosaved"></span>
		</footer>
	</aside>
	<div id="database-error">
		<div data-message="database_error_message"></div>
		<ul></ul>
		<div data-message="database_error_restart"></div>
		<div data-message="database_error_history_settings"></div>
	</div>
	<template id="newtab-site">
		<div class="newtab-site" draggable="true">
			<a class="newtab-link">
				<span class="newtab-thumbnail"></span>
			</a>
			<span class="ntt-pin-stripe"></span>
			<span class="ntt-stat-chip"></span>
			<span class="ntt-actions-kebab"></span>
			<span class="ntt-actions"></span>
			<span class="ntt-drag-handle"></span>
			<span class="ntt-add-tile"></span>
			<span class="ntt-overlay">
				<span class="ntt-favicon"></span>
				<span class="newtab-title"></span>
			</span>
		</div>
	</template>
	<script type="text/javascript" src="common.js"></script>
	<div id="wallpaper-picker" hidden="">
		<div id="wallpaper-header">
			<h2 data-message="wallpaper_dialog_title"></h2>
			<button id="wallpaper-close" class="close-button"></button>
		</div>
		<div id="wallpaper-actions">
			<button id="wallpaper-reset" class="ntt-btn-ghost" data-message="wallpaper_reset"></button>
			<label id="wallpaper-upload-label" class="ntt-btn-ghost">
				<span data-message="wallpaper_upload"></span>
				<input id="wallpaper-upload" type="file" accept="image/*" />
			</label>
		</div>
		<div id="wallpaper-grid"></div>
	</div>

	<script type="text/javascript" src="icons.js"></script>
	<script type="text/javascript" src="stats.js"></script>
	<script type="text/javascript" src="tiles-shim.js"></script>
	<script type="text/javascript" src="prefs.js"></script>
	<script type="text/javascript" src="awesomebar.js"></script>

	<script type="text/javascript" src="fx-newTab.js"></script>
