# pnpm settings live here. pnpm 11 no longer reads pnpm-native settings from
# the package.json `pnpm` field or from .npmrc — they were silently ignored
# (which is why the supply-chain guard below never actually fired under the
# old pnpm 10.0.0 pin). Single-package repo, so `packages` lists only the root.
packages:
  - .

# Supply-chain guard: refuse package versions younger than 7 days.
# UNIT IS MINUTES — 10080 = 7 days. (The old `.npmrc` value 604800 was written
# as seconds; under an enforcing pnpm that would be ~420 days. pnpm 11 enforces
# this during resolution; pnpm 10.0.0 did not enforce it at all.)
minimumReleaseAge: 10080

# Auto-install peerDependencies (was auto-install-peers=true in .npmrc).
autoInstallPeers: true

# Force-patch transitive advisories: an exact pin here, never a floated
# resolution (CONTRIBUTING.md "Keeping dependencies current"). Each floor is the
# highest "Patched versions" across every advisory `pnpm audit` reports for that
# package, and each was confirmed to exist with `pnpm view <pkg>@<version>
# version`. Floors re-derived 2026-10-24.
#
# AN OVERRIDE IS ITSELF A FROZEN PIN, so it goes stale silently and needs
# re-deriving every sweep, not just when the dependency tree changes. Every
# floor set on 2026-09-12 was vulnerable again by 2026-10-24 — `fast-uri` most
# sharply: the exact 3.1.6 pinned to fix one advisory became the subject of the
# next (`=3.1.6`). Treat the whole block as perishable.
#
# brace-expansion needs TWO selectors: the tree carries both a 1.x line (via
# minimatch 3.x) and a >=3 line, each with its own advisory chain. A single
# override would force one major on both.
#
# A `pkg@<X` selector is self-disabling: it stops matching once the tree
# resolves >=X on its own, so a parent fixing itself upstream makes the entry a
# harmless no-op rather than a wrong pin. Prune such entries at a sweep for
# tidiness, but verify with `pnpm why <pkg>` first — hono, js-yaml and
# ip-address all still resolve BELOW their floors via @modelcontextprotocol/sdk
# and web-ext → addons-linter → eslint, so all three remain load-bearing.
#
# Trap worth remembering: an advisory's "Patched versions" floor is NOT proof a
# release exists — three cases so far. shell-quote's read ">=1.8.5" (never
# published; 1.10.0 was the first fix), image-size's read ">=2.0.3" while 2.0.2
# was still the newest, and node-forge's reads ">=1.4.1" while 1.4.0 remains
# latest (see the accepted-risk block below). A phantom pin fails the whole
# install with ERR_PNPM_NO_MATCHING_VERSION, so always confirm first.
overrides:
  'hono@<4.12.25': '4.12.25'
  'undici@<7.30.1': '7.30.1'
  'adm-zip@<0.6.1': '0.6.1'
  'brace-expansion@<2': '1.1.20'
  'brace-expansion@>=3': '5.0.11'
  'js-yaml@<4.3.2': '4.3.2'
  'shell-quote@<1.11.0': '1.11.0'
  'fast-uri@<3.1.7': '3.1.7'
  'ip-address@<10.3.1': '10.3.1'
  'proxy-addr@<2.0.8': '2.0.8'
  'zod@<4.6.6': '4.6.6'
  'source-map-js@<1.2.2': '1.2.2'
  'vite@<8.1.6': '8.1.6'
# image-size needs NO entry and NO exception any more: addons-linter now
# declares image-size 2.0.4, which web-ext 10.8.0 → addons-linter 10.14.0 pulls
# in. The 2026-09-12 accepted-risk block recorded here is deleted rather than
# amended — and its stated reasoning was wrong on both counts within six weeks:
# upstream image-size was NOT permanently archived (2.0.3/2.0.4 shipped), and
# addons-linter did NOT stay on 2.0.2. The lesson kept instead: an
# "upstream is dead, this will never be fixed" conclusion is a snapshot, so a
# no-fix exception needs an expiry and a re-check, which is what surfaced this.

# ---------------------------------------------------------------------------
# Accepted risk: node-forge (1 high advisory) — reviewed 2026-10-24
# ---------------------------------------------------------------------------
# GHSA-86w9-cpqp-85rv — RSA PKCS#1 v1.5 signature verification accepts extra
# nested DigestAlgorithm elements (a signature-forgery weakness).
#
# Why an exception and not a pin: NO FIX IS PUBLISHED. The advisory's floor
# reads ">=1.4.1", but `pnpm view node-forge version` returns 1.4.0 — the
# newest release is itself the vulnerable one, so a pin fails the install.
#
# Why the vulnerable code is unreachable here:
#   Reach is `web-ext → @devicefarmer/adbkit → node-forge`. adbkit is web-ext's
#   Android Debug Bridge client, used only by `web-ext run --target=
#   firefox-android`. This project never targets Android: no script, run
#   script or build path passes that target (grep for "firefox-android"/"adb"
#   returns nothing), and both test tiers drive desktop Firefox and Chrome. The
#   signature-verification path only executes while authenticating to an
#   Android device over ADB, which never happens. Dev-only either way — the
#   shipped extension has no runtime dependencies.
#
# Revisit trigger, with an expiry (the image-size block deleted above had none
# and its "will never be fixed" reasoning expired within six weeks):
#   - Re-check `pnpm view node-forge version` at EVERY dependency sweep; drop
#     this entry and add a normal override the moment >=1.4.1 exists.
#   - Revisit immediately if Android testing is ever added — that would make
#     the path reachable and this acceptance invalid.
auditConfig:
  # Must be ignoreGhsas, NOT ignoreCves: pnpm audit keys advisories by the GHSA
  # id it prints in the "More info" row, and an ignoreCves entry naming the
  # equivalent CVE silently matches nothing (verified 2026-09-12 — the
  # advisories still failed the gate with exit 1).
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge RSA PKCS#1 v1.5 signature verification
    # TEMPORARY — EXPIRES 2026-10-29. body-parser DoS via trailing bytes after
    # a compressed request body. The only fix, 2.4.0, was published 2026-10-22
    # and is blocked by minimumReleaseAge until 2026-10-29. Deliberately NOT
    # bypassed via minimumReleaseAgeExclude: a days-old release of a widely
    # used package is exactly what the 7-day guard exists to catch, and this
    # advisory cannot fire here — express arrives with @modelcontextprotocol/sdk
    # and addons-linter's scanner utils, but the UAT MCP server uses
    # StdioServerTransport (tests/uat/_tools/mcp-server.mjs) and nothing in the
    # project starts an HTTP server. ON/AFTER 2026-10-29: delete this line and
    # add `'body-parser@<2.4.0': '2.4.0'` to `overrides`. The advisory is
    # published under TWO GHSA ids (same title, range and fix); both go.
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-27r3-jxmh-p828
