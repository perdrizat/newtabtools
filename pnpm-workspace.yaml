# pnpm settings live here. pnpm 11 no longer reads pnpm-native settings from
# the package.json `pnpm` field or from .npmrc — they were silently ignored
# (which is why the supply-chain guard below never actually fired under the
# old pnpm 10.0.0 pin). Single-package repo, so `packages` lists only the root.
packages:
  - .

# Supply-chain guard: refuse package versions younger than 7 days.
# UNIT IS MINUTES — 10080 = 7 days. (The old `.npmrc` value 604800 was written
# as seconds; under an enforcing pnpm that would be ~420 days. pnpm 11 enforces
# this during resolution; pnpm 10.0.0 did not enforce it at all.)
minimumReleaseAge: 10080
# Scoped exception (keeps the 7-day floor for everything else). undici 7.28.0 is
# the in-range security fix for GHSA-vmh5-mc38-953g / -vxpw-j846-p89q /
# -hm92-r4w5-c3mj (reached via test-only jsdom), published 2026-06-15 and pinned
# exactly in `overrides` below. Safe to remove after 2026-06-22 (clears 7 days).
minimumReleaseAgeExclude:
  - undici

# Auto-install peerDependencies (was auto-install-peers=true in .npmrc).
autoInstallPeers: true

# Force-patch transitive advisories — parents' latest still pull vulnerable deps:
#   hono  : @modelcontextprotocol/sdk → @hono/node-server (GHSA-88fw-hqm2-52qc)
#   undici: jsdom (the three advisories above)
# shell-quote is NOT here: web-ext 10.4.0 → fx-runner 1.5.0 ships shell-quote
# 1.8.4 natively, so no override is needed.
overrides:
  'hono@<4.12.25': '4.12.25'
  'undici@<7.28.0': '7.28.0'
